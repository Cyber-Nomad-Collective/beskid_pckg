# Local production-like Rust/React registry runtime.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pckgdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pckg_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pckgdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pckg:
    build:
      context: ..
      dockerfile: pckg/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PCKG_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${PCKG_DB_HOST:-postgres}:${PCKG_DB_PORT:-5432}/${POSTGRES_DB:-pckgdb}
      PCKG_ARTIFACT_ROOT: ${PCKG_ARTIFACT_ROOT:-/app/packages}
      PCKG_WEB_ROOT: /app/web
      PCKG_BIND_ADDRESS: 0.0.0.0:8082
      SHELL_AUTH_MODE: ${SHELL_AUTH_MODE:-mock}
      SHELL_MOCK_SUBJECT: ${SHELL_MOCK_SUBJECT:-local-admin}
      SHELL_MOCK_GROUPS: ${SHELL_MOCK_GROUPS:-pckg-admins}
      SHELL_ADMIN_GROUP: ${SHELL_ADMIN_GROUP:-pckg-admins}
      SHELL_MODERATOR_GROUP: ${SHELL_MODERATOR_GROUP:-pckg-moderators}
    expose:
      - "8082"
    volumes:
      - pckg_packages:/app/packages
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pckg_pg_data:
  pckg_packages:
