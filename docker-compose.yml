# Local production-like Rust/Bun registry runtime.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pckgdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pckg_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pckgdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pckg:
    build:
      context: ..
      dockerfile: pckg/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PCKG_AUTH_HUB_SERVICE_TOKEN: ${PCKG_AUTH_HUB_SERVICE_TOKEN:?set the paired Auth Hub service token}
      PCKG_SESSION_SECRET: ${PCKG_SESSION_SECRET:?set a separate session signing secret}
      # HTTP-only local development may opt out; all HTTPS deployments must use true.
      PCKG_COOKIE_SECURE: ${PCKG_COOKIE_SECURE:-false}
      PCKG_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${PCKG_DB_HOST:-postgres}:${PCKG_DB_PORT:-5432}/${POSTGRES_DB:-pckgdb}
      PCKG_ARTIFACT_ROOT: ${PCKG_ARTIFACT_ROOT:-/app/packages}
      Storage__UploadsRootPath: ${Storage__UploadsRootPath:-/app/data/uploads}
    expose:
      - "8082"
    volumes:
      # The image entrypoint initializes these named volumes as uid/gid 10001.
      - pckg_packages:/app/packages
      - pckg_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pckg_pg_data:
  pckg_packages:
  pckg_data:
